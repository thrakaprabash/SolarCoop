<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarCoop · Opening & onboarding</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee7de;color:#221408;font:15px system-ui;display:flex;align-items:center;justify-content:center;gap:64px;min-height:100vh;padding:24px}body.dark{background:#26231f;color:#f7f3ee}aside{max-width:300px}h1{font-size:32px;letter-spacing:-1px}p{line-height:1.7;opacity:.75}button{cursor:pointer;border:1px solid #b9a38c;background:transparent;color:inherit;border-radius:12px;padding:12px 16px;margin:4px 0;font:inherit}.phone{position:relative;width:min(390px,90vw);aspect-ratio:390/844;box-shadow:0 24px 70px #22140826;border-radius:28px;overflow:hidden}img{width:100%;display:block}.hit{position:absolute;border:0;margin:0;padding:0;background:transparent;border-radius:16px}.hit:focus-visible{outline:3px solid #386572;outline-offset:-3px}.next{left:7.18%;width:85.64%;top:86.14%;height:6.63%}.skip{left:81%;width:14%;top:6.5%;height:4%}.create{left:7.18%;width:85.64%;top:77.13%;height:6.63%}.login{left:7.18%;width:85.64%;top:85.3%;height:6.63%}#label{font-weight:650;color:#c05621}.dark #label{color:#f6ad55}@media(max-width:760px){body{flex-direction:column;gap:20px}aside{max-width:390px}h1{font-size:24px;margin:0}.phone{max-width:340px}p{margin:8px 0}}
</style><aside><h1>Share the sun.</h1><p>Opening and onboarding concept for SolarCoop. Explore both themes and tap Next, Skip or Get started.</p><div id="label"></div><p><button id="theme">Switch to dark</button> <button id="restart">Replay opening</button></p><p id="feedback" aria-live="polite">Design preview. Account actions are shown as handoffs to the existing app.</p></aside><main class="phone" aria-label="SolarCoop mobile preview"><img id="screen" alt=""><div id="actions"></div></main><script>
const ids=['00-opening','01-loading','02-monitor','03-community','04-support','05-welcome'];const names=['Opening','Loading','Monitor your solar','Community sharing','Alerts & support','Welcome'];let mode='light',step=0,timer;
function show(n){clearTimeout(timer);step=n;document.querySelector('#screen').src=`svg/${mode}/${ids[n]}.svg`;document.querySelector('#screen').alt=`${names[n]} — ${mode} theme`;document.querySelector('#label').textContent=`${String(n+1).padStart(2,'0')} / 06 · ${names[n]}`;const actions=document.querySelector('#actions');actions.replaceChildren();const add=(name,cls,fn)=>{const b=document.createElement('button');b.className=`hit ${cls}`;b.setAttribute('aria-label',name);b.onclick=fn;actions.append(b)};if(n<2)timer=setTimeout(()=>show(n+1),n===0?1200:1000);else if(n<5){add(n===4?'Get started':'Next','next',()=>show(n+1));add('Skip onboarding','skip',()=>show(5))}else{add('Create an account','create',()=>document.querySelector('#feedback').textContent='Create an account → existing Register screen. This preview does not create an account.');add('Log in','login',()=>document.querySelector('#feedback').textContent='Log in → existing Login screen. This preview does not sign you in.')}}
document.querySelector('#theme').onclick=()=>{mode=mode==='light'?'dark':'light';document.body.classList.toggle('dark',mode==='dark');document.querySelector('#theme').textContent=`Switch to ${mode==='light'?'dark':'light'}`;show(step)};document.querySelector('#restart').onclick=()=>show(0);show(0);
</script></html>
