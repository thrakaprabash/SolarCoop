<svg width="1000" height="800" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" style="background-color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif;">
  
  <!-- Canvas Background -->
  <rect x="0" y="0" width="1000" height="800" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#000000">SOL-94 Role-Based Access Sitemap</text>

  <!-- ================= LINES / CONNECTORS ================= -->
  
  <!-- Login to Identify User Role -->
  <line x1="500" y1="146" x2="500" y2="200" stroke="#999999" stroke-width="2"/>
  
  <!-- Identify User Role to Horizontal Trunk -->
  <line x1="500" y1="246" x2="500" y2="300" stroke="#999999" stroke-width="2"/>
  
  <!-- Horizontal Trunk -->
  <line x1="160" y1="300" x2="840" y2="300" stroke="#999999" stroke-width="2"/>
  
  <!-- Connectors to Branches -->
  <line x1="160" y1="300" x2="160" y2="330" stroke="#999999" stroke-width="2"/>
  <line x1="380" y1="300" x2="380" y2="330" stroke="#999999" stroke-width="2"/>
  <line x1="620" y1="300" x2="620" y2="330" stroke="#999999" stroke-width="2"/>
  <line x1="840" y1="300" x2="840" y2="330" stroke="#999999" stroke-width="2"/>

  <!-- Consumer Branch Connectors -->
  <line x1="160" y1="376" x2="160" y2="410" stroke="#999999" stroke-width="2"/>
  <line x1="160" y1="456" x2="160" y2="490" stroke="#999999" stroke-width="2"/>
  <line x1="160" y1="536" x2="160" y2="570" stroke="#999999" stroke-width="2"/>
  <line x1="160" y1="616" x2="160" y2="650" stroke="#999999" stroke-width="2"/>

  <!-- Solar Owner Branch Connectors -->
  <line x1="380" y1="376" x2="380" y2="410" stroke="#999999" stroke-width="2"/>
  <line x1="380" y1="456" x2="380" y2="490" stroke="#999999" stroke-width="2"/>
  <line x1="380" y1="536" x2="380" y2="570" stroke="#999999" stroke-width="2"/>

  <!-- Admin Branch Connectors -->
  <line x1="620" y1="376" x2="620" y2="410" stroke="#999999" stroke-width="2"/>
  <line x1="620" y1="456" x2="620" y2="490" stroke="#999999" stroke-width="2"/>
  <line x1="620" y1="536" x2="620" y2="570" stroke="#999999" stroke-width="2"/>

  <!-- Technician Branch Connectors -->
  <line x1="840" y1="376" x2="840" y2="410" stroke="#999999" stroke-width="2"/>
  <line x1="840" y1="456" x2="840" y2="490" stroke="#999999" stroke-width="2"/>

  <!-- ================= TOP LEVEL NODES ================= -->

  <!-- Login Node -->
  <rect x="410" y="100" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="500" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Login</text>
  
  <!-- Identify User Role Decision Node -->
  <!-- Using a distinct rounded style for a decision point -->
  <rect x="400" y="200" width="200" height="46" rx="23" fill="#F9F9F9" stroke="#333333" stroke-width="2"/>
  <text x="500" y="228" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Identify User Role</text>

  <!-- ================= BRANCH LABELS ================= -->
  
  <text x="160" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#666666">Consumer</text>
  <text x="380" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#666666">Solar Owner</text>
  <text x="620" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#666666">Admin</text>
  <text x="840" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#666666">Technician</text>


  <!-- ================= BRANCH 1: CONSUMER ================= -->
  
  <rect x="70" y="330" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="160" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#000000">Consumer Dashboard</text>

  <rect x="70" y="410" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="160" y="438" text-anchor="middle" font-size="15" fill="#000000">Savings</text>

  <rect x="70" y="490" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="160" y="518" text-anchor="middle" font-size="15" fill="#000000">Billing</text>

  <rect x="70" y="570" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="160" y="598" text-anchor="middle" font-size="15" fill="#000000">Community Forum</text>

  <rect x="70" y="650" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="160" y="678" text-anchor="middle" font-size="15" fill="#000000">Profile</text>


  <!-- ================= BRANCH 2: SOLAR OWNER ================= -->

  <rect x="290" y="330" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="380" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#000000">Solar Owner Dashboard</text>

  <rect x="290" y="410" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="380" y="438" text-anchor="middle" font-size="15" fill="#000000">Energy Sharing</text>

  <rect x="290" y="490" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="380" y="518" text-anchor="middle" font-size="15" fill="#000000">Savings</text>

  <rect x="290" y="570" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="380" y="598" text-anchor="middle" font-size="15" fill="#000000">Profile</text>


  <!-- ================= BRANCH 3: ADMIN ================= -->

  <rect x="530" y="330" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="620" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#000000">Admin Dashboard</text>

  <rect x="530" y="410" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="620" y="438" text-anchor="middle" font-size="15" fill="#000000">Member Management</text>

  <rect x="530" y="490" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="620" y="518" text-anchor="middle" font-size="15" fill="#000000">Alerts</text>

  <rect x="530" y="570" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="620" y="598" text-anchor="middle" font-size="15" fill="#000000">Profile</text>


  <!-- ================= BRANCH 4: TECHNICIAN ================= -->

  <rect x="750" y="330" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="840" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#000000">Fault Alerts</text>

  <rect x="750" y="410" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="840" y="438" text-anchor="middle" font-size="15" fill="#000000">Maintenance Jobs</text>

  <rect x="750" y="490" width="180" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="840" y="518" text-anchor="middle" font-size="15" fill="#000000">Profile</text>

</svg>
