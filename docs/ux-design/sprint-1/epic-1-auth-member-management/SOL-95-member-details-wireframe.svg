<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" style="background-color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif;">
  
  <!-- Mobile Device Outline -->
  <rect x="0" y="0" width="390" height="844" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  
  <!-- 1. Top Header -->
  <!-- Back Arrow -->
  <path d="M 32 62 L 22 52 L 32 42" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="22" y1="52" x2="42" y2="52" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Title -->
  <text x="195" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#000000">Member Details</text>

  <!-- 2. Circular Avatar Placeholder -->
  <circle cx="195" cy="140" r="45" fill="#F9F9F9" stroke="#999999" stroke-width="1.5"/>
  <g transform="translate(195, 140)" stroke="#999999" stroke-width="1.5" fill="none">
    <circle cx="0" cy="-10" r="14"/>
    <path d="M -22 25 Q 0 5 22 25"/>
  </g>

  <!-- 3. Member Name -->
  <text x="195" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#000000">Kamala Silva</text>

  <!-- 4. Member ID -->
  <text x="195" y="240" text-anchor="middle" font-size="15" fill="#666666">Member ID: M-002</text>

  <!-- 5. Status -->
  <!-- Encased in a small badge-like outline for better wireframing, but text strictly included -->
  <rect x="155" y="255" width="80" height="28" rx="14" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="195" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#333333">Status: Pending</text>

  <!-- 6. Section Heading: Contact -->
  <text x="24" y="330" font-size="18" font-weight="700" fill="#000000">Contact</text>

  <!-- Contact Info Container -->
  <rect x="24" y="345" width="342" height="96" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- 7. Phone -->
  <text x="40" y="375" font-size="15" fill="#333333">Phone: 077 123 4567</text>
  <line x1="24" y1="393" x2="366" y2="393" stroke="#EEEEEE" stroke-width="1"/>
  
  <!-- 8. Address -->
  <text x="40" y="420" font-size="15" fill="#333333">Address: Colombo</text>

  <!-- 9. Section Heading: Energy Details -->
  <text x="24" y="485" font-size="18" font-weight="700" fill="#000000">Energy Details</text>

  <!-- Energy Details Container -->
  <rect x="24" y="500" width="342" height="144" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>

  <!-- 10. Grid Account -->
  <text x="40" y="530" font-size="15" fill="#333333">Grid Account: G-123456</text>
  <line x1="24" y1="548" x2="366" y2="548" stroke="#EEEEEE" stroke-width="1"/>

  <!-- 11. Solar Capacity -->
  <text x="40" y="578" font-size="15" fill="#333333">Solar Capacity: 5 kW</text>
  <line x1="24" y1="596" x2="366" y2="596" stroke="#EEEEEE" stroke-width="1"/>

  <!-- 12. Battery Capacity -->
  <text x="40" y="626" font-size="15" fill="#333333">Battery Capacity: 10 kWh</text>

  <!-- 13. Primary Button: Approve Member -->
  <rect x="24" y="675" width="342" height="52" rx="26" fill="#333333" stroke="#333333" stroke-width="1.5"/>
  <text x="195" y="706" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Approve Member</text>

  <!-- 14. Outlined Warning Button: Block / Deactivate -->
  <rect x="24" y="740" width="342" height="52" rx="26" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="195" y="771" text-anchor="middle" font-size="16" font-weight="600" fill="#333333">Block / Deactivate</text>

  <!-- 15. Bottom Text -->
  <text x="195" y="820" text-anchor="middle" font-size="13" fill="#999999">Administrator permission required</text>

</svg>
