<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" style="background-color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif;">
  
  <!-- Mobile Device Background Outline -->
  <rect x="0" y="0" width="390" height="844" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  
  <!-- 1. Top Header -->
  <!-- Back Arrow -->
  <path d="M 32 62 L 22 52 L 32 42" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="22" y1="52" x2="42" y2="52" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Title -->
  <text x="195" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#000000">Member Management</text>

  <!-- 2. Search Input -->
  <rect x="24" y="90" width="342" height="48" rx="24" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <!-- Magnifying Glass Icon -->
  <circle cx="48" cy="114" r="7" fill="none" stroke="#666666" stroke-width="2"/>
  <line x1="53" y1="119" x2="59" y2="125" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
  <!-- Placeholder Text -->
  <text x="75" y="119" font-size="15" fill="#666666">Search by name or member ID</text>

  <!-- 3. Filter Chips -->
  <!-- "All" Chip (Active State) -->
  <rect x="24" y="160" width="60" height="32" rx="16" fill="#333333" stroke="#333333" stroke-width="1"/>
  <text x="54" y="181" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">All</text>
  
  <!-- "Active" Chip -->
  <rect x="96" y="160" width="75" height="32" rx="16" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="133.5" y="181" text-anchor="middle" font-size="14" font-weight="500" fill="#333333">Active</text>
  
  <!-- "Pending" Chip -->
  <rect x="183" y="160" width="85" height="32" rx="16" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="225.5" y="181" text-anchor="middle" font-size="14" font-weight="500" fill="#333333">Pending</text>
  
  <!-- "Inactive" Chip -->
  <rect x="280" y="160" width="86" height="32" rx="16" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="323" y="181" text-anchor="middle" font-size="14" font-weight="500" fill="#333333">Inactive</text>

  <!-- 4. & 5. Vertical List of Member Cards -->
  
  <!-- Card 1: Nimal Perera -->
  <rect x="24" y="215" width="342" height="76" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Name -->
  <text x="40" y="245" font-size="16" font-weight="600" fill="#000000">Nimal Perera</text>
  <!-- Member ID -->
  <text x="40" y="267" font-size="14" fill="#666666">Member ID: M-001</text>
  <!-- Status Badge -->
  <rect x="240" y="240" width="70" height="26" rx="13" fill="#EAEAEA" stroke="#CCCCCC" stroke-width="1"/>
  <text x="275" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">Active</text>
  <!-- Right Arrow -->
  <path d="M 338 245 L 346 253 L 338 261" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 2: Kamala Silva -->
  <rect x="24" y="305" width="342" height="76" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Name -->
  <text x="40" y="335" font-size="16" font-weight="600" fill="#000000">Kamala Silva</text>
  <!-- Member ID -->
  <text x="40" y="357" font-size="14" fill="#666666">Member ID: M-002</text>
  <!-- Status Badge -->
  <rect x="240" y="330" width="70" height="26" rx="13" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="275" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#333333">Pending</text>
  <!-- Right Arrow -->
  <path d="M 338 335 L 346 343 L 338 351" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 3: Sunil Fernando -->
  <rect x="24" y="395" width="342" height="76" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Name -->
  <text x="40" y="425" font-size="16" font-weight="600" fill="#000000">Sunil Fernando</text>
  <!-- Member ID -->
  <text x="40" y="447" font-size="14" fill="#666666">Member ID: M-003</text>
  <!-- Status Badge -->
  <rect x="240" y="420" width="70" height="26" rx="13" fill="#F9F9F9" stroke="#CCCCCC" stroke-width="1"/>
  <text x="275" y="438" text-anchor="middle" font-size="12" font-weight="600" fill="#666666">Inactive</text>
  <!-- Right Arrow -->
  <path d="M 338 425 L 346 433 L 338 441" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 6. Bottom Label -->
  <text x="195" y="800" text-anchor="middle" font-size="13" fill="#999999">Admin access only</text>

</svg>
