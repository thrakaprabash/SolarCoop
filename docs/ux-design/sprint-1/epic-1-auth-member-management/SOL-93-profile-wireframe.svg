<svg width="390" height="1250" viewBox="0 0 390 1250" xmlns="http://www.w3.org/2000/svg" style="background-color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif;">
  
  <!-- Screen Background -->
  <rect x="0" y="0" width="390" height="1250" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  
  <!-- 1. Top Header -->
  <!-- Back Arrow -->
  <path d="M 32 62 L 22 52 L 32 42" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="22" y1="52" x2="42" y2="52" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Title -->
  <text x="195" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#000000">My Profile</text>

  <!-- 2. Profile Avatar Placeholder -->
  <circle cx="195" cy="140" r="45" fill="#F9F9F9" stroke="#999999" stroke-width="1.5"/>
  <g transform="translate(195, 140)" stroke="#999999" stroke-width="1.5" fill="none">
    <circle cx="0" cy="-10" r="14"/>
    <path d="M -22 25 Q 0 5 22 25"/>
  </g>

  <!-- 3. Change Profile Photo Link -->
  <text x="195" y="215" text-anchor="middle" font-size="14" font-weight="500" fill="#333333" text-decoration="underline">Change Profile Photo</text>

  <!-- 4. Section Heading: Personal Information -->
  <text x="24" y="265" font-size="18" font-weight="700" fill="#000000">Personal Information</text>

  <!-- 5. Full Name -->
  <text x="24" y="305" font-size="14" font-weight="600" fill="#333333">Full Name</text>
  <rect x="24" y="315" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="40" y="344" font-size="15" fill="#000000">irusha shaveen</text>

  <!-- 6. Email Address -->
  <text x="24" y="390" font-size="14" font-weight="600" fill="#333333">Email Address</text>
  <rect x="24" y="400" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="40" y="429" font-size="15" fill="#000000">Irushashaveen@gmail.com</text>

  <!-- 7. Phone Number -->
  <text x="24" y="475" font-size="14" font-weight="600" fill="#333333">Phone Number</text>
  <rect x="24" y="485" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="40" y="514" font-size="15" fill="#000000">+94 77 123 4567</text>

  <!-- 8. Household Address -->
  <text x="24" y="560" font-size="14" font-weight="600" fill="#333333">Household Address</text>
  <rect x="24" y="570" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="40" y="599" font-size="15" fill="#000000">123 Solar Way, Colombo, Sri Lanka</text>

  <!-- 9. Section Heading: Energy Details -->
  <text x="24" y="660" font-size="18" font-weight="700" fill="#000000">Energy Details</text>

  <!-- 10. Grid Account Number -->
  <text x="24" y="700" font-size="14" font-weight="600" fill="#333333">Grid Account Number</text>
  <rect x="24" y="710" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="40" y="739" font-size="15" fill="#000000">GRID-9928374</text>

  <!-- 11. Solar Panel Owner (Yes / No Selector) -->
  <text x="24" y="785" font-size="14" font-weight="600" fill="#333333">Solar Panel Owner</text>
  <!-- Selector Container -->
  <rect x="24" y="795" width="342" height="48" rx="8" fill="#F2F2F2" stroke="#999999" stroke-width="1"/>
  <!-- Active "Yes" Tab -->
  <rect x="28" y="799" width="167" height="40" rx="6" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <text x="111" y="824" text-anchor="middle" font-size="15" font-weight="600" fill="#000000">Yes</text>
  <!-- Inactive "No" Tab -->
  <text x="278" y="824" text-anchor="middle" font-size="15" fill="#666666">No</text>

  <!-- 12. Battery Capacity (Editable with kWh) -->
  <text x="24" y="870" font-size="14" font-weight="600" fill="#333333">Battery Capacity</text>
  <rect x="24" y="880" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="40" y="909" font-size="15" fill="#000000">13.5</text>
  <text x="350" y="909" text-anchor="end" font-size="15" fill="#666666">kWh</text>

  <!-- 13. Section Heading: Preferences -->
  <text x="24" y="970" font-size="18" font-weight="700" fill="#000000">Preferences</text>

  <!-- 14. Notifications Row (ON Toggle) -->
  <text x="24" y="1015" font-size="16" font-weight="500" fill="#000000">Notifications</text>
  <!-- Toggle Switch (ON State) -->
  <rect x="316" y="996" width="50" height="28" rx="14" fill="#333333" stroke="#333333" stroke-width="1"/>
  <circle cx="351" cy="1010" r="11" fill="#FFFFFF"/>

  <!-- 15. Save Changes Primary Button -->
  <rect x="24" y="1070" width="342" height="52" rx="26" fill="#333333"/>
  <text x="195" y="1101" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Save Changes</text>

  <!-- 16. Logout Outlined Button -->
  <rect x="24" y="1138" width="342" height="52" rx="26" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="195" y="1169" text-anchor="middle" font-size="16" font-weight="600" fill="#333333">Logout</text>

</svg>
