<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" style="background-color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif;">
  
  <!-- BACKGROUND: Profile Screen (Dimmed later) -->
  <g id="Background-Profile-Screen">
    <!-- Device Outline -->
    <rect x="0" y="0" width="390" height="844" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    
    <!-- Header -->
    <text x="195" y="65" text-anchor="middle" font-size="20" font-weight="700" fill="#333333">My Profile</text>
    <line x1="0" y1="90" x2="390" y2="90" stroke="#E0E0E0" stroke-width="1"/>

    <!-- Avatar Placeholder -->
    <circle cx="195" cy="160" r="45" fill="#F9F9F9" stroke="#CCCCCC" stroke-width="1.5"/>
    <g transform="translate(195, 160)" stroke="#999999" stroke-width="1.5" fill="none">
      <circle cx="0" cy="-10" r="14"/>
      <path d="M -22 25 Q 0 5 22 25"/>
    </g>

    <!-- Name and Email Placeholders -->
    <text x="195" y="235" text-anchor="middle" font-size="20" font-weight="600" fill="#333333">Jane Doe</text>
    <text x="195" y="260" text-anchor="middle" font-size="14" fill="#666666">jane.doe@example.com</text>

    <!-- Settings List Placeholders -->
    <rect x="24" y="310" width="342" height="56" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="44" y="344" font-size="16" fill="#333333">Account Settings</text>

    <rect x="24" y="382" width="342" height="56" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="44" y="416" font-size="16" fill="#333333">Energy Usage</text>

    <rect x="24" y="454" width="342" height="56" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="44" y="488" font-size="16" fill="#333333">Payment Methods</text>

    <rect x="24" y="526" width="342" height="56" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="44" y="560" font-size="16" fill="#333333">Notifications</text>

    <!-- Logout List Item -->
    <rect x="24" y="598" width="342" height="56" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="44" y="632" font-size="16" font-weight="600" fill="#333333">Logout</text>
  </g>

  <!-- DIMMING OVERLAY -->
  <!-- Represents the background being dimmed when the modal opens -->
  <rect x="0" y="0" width="390" height="844" fill="#000000" fill-opacity="0.45"/>

  <!-- FOREGROUND: Logout Confirmation Modal -->
  <g id="Logout-Modal">
    <!-- Modal Container -->
    <rect x="35" y="270" width="320" height="260" rx="16" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
    
    <!-- 1. Logout Icon Placeholder -->
    <g transform="translate(195, 315)">
      <!-- Box with arrow out -->
      <path d="M-6,-14 v-4 h-14 v36 h14 v-4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-6" y1="0" x2="16" y2="0" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
      <polyline points="10,-6 16,0 10,6" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 2. Heading -->
    <text x="195" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#000000">Log out?</text>

    <!-- 3. Message -->
    <text x="195" y="410" text-anchor="middle" font-size="15" fill="#333333">Are you sure you want to log out</text>
    <text x="195" y="432" text-anchor="middle" font-size="15" fill="#333333">of SolarShare?</text>

    <!-- 4. Buttons -->
    <!-- Secondary Outlined Button: Cancel -->
    <rect x="55" y="465" width="130" height="48" rx="24" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/>
    <text x="120" y="495" text-anchor="middle" font-size="16" font-weight="600" fill="#333333">Cancel</text>

    <!-- Primary Dark Filled Button: Log out -->
    <rect x="205" y="465" width="130" height="48" rx="24" fill="#333333"/>
    <text x="270" y="495" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Log out</text>
  </g>

</svg>
